# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          _build
          priv/native
          native/eevm_bls/target
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock', 'native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/src/**') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors
    - name: Run Credo
      run: mix credo --strict
    - name: Run Dialyzer
      run: mix dialyzer

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          _build
          priv/native
          native/eevm_bls/target
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock', 'native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/src/**') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          _build
          priv/native
          native/eevm_bls/target
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock', 'native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/src/**') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    - name: Compile project
      run: mix compile
    - name: Generate docs (fail on ExDoc warnings)
      run: |
        mix docs 2>&1 | tee docs.log
        # Only fail on warnings emitted by ExDoc itself (after "Generating docs..."),
        # not on compile warnings from deps that may surface during a fresh build.
        if awk '/Generating docs\.\.\./{flag=1; next} flag' docs.log \
             | grep -E "^[[:space:]]+warning:"; then
          echo "::error::ExDoc emitted warnings — see log above"
          exit 1
        fi
