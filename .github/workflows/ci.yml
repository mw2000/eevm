# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Check for native code
      # eevm is pure Elixir: no NIFs, no Rustler, no OTP :crypto or :public_key.
      run: "! grep -rnE ':crypto|:public_key|Rustler|NIF' lib mix.exs"
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors
    - name: Run Credo
      run: mix credo --strict
    - name: Run Dialyzer
      run: mix dialyzer

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Documented minimum; shares the build cache with lint and docs.
          - elixir: '1.18.3'
            otp: '27.0'
            cache-prefix: ''
          - elixir: '1.19'
            otp: '28'
            cache-prefix: 'otp28-elixir1.19-'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    # Build output depends on the Elixir/OTP version. The prefix goes before
    # "build-" so the shared "build-" restore key never matches another version.
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: _build
        key: ${{ runner.os }}-${{ matrix.cache-prefix }}build-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.cache-prefix }}build-
    - name: Install dependencies
      run: mix deps.get
    # Fails on any compile warning in the test run, such as a test calling a
    # deprecated API.
    - name: Run tests (warnings as errors)
      run: mix test --warnings-as-errors

  conformance:
    name: Conformance (ethereum/tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    # Each step fails only on failures that its known_failures.txt does not
    # list; the file's header has the command that regenerates it. The
    # timeout is well above the slowest passing case (about 35 s locally), so
    # a slower runner cannot turn a pass into a timeout.
    - name: GeneralStateTests
      run: >-
        mix eevm.state_tests
        --known-failures test/fixtures/state_tests/known_failures.txt
        --timeout 180000
        --report state_tests.json
    - name: BlockchainTests
      if: ${{ !cancelled() }}
      run: >-
        mix eevm.blockchain_tests
        'test/fixtures/state_tests/ethereum-tests/BlockchainTests/{ValidBlocks,InvalidBlocks,TransitionTests}/**/*.json'
        --known-failures test/fixtures/blockchain_tests/known_failures.txt
        --timeout 180000
        --report blockchain_tests.json
    - name: Upload reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: conformance-reports
        path: '*_tests.json'

  conformance-eest:
    name: Conformance (EEST ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One job per suite and release. fixtures_stable covers mainnet forks
    # through Prague; fixtures_develop adds Osaka, of which only the Osaka
    # cases run (--fork osaka). Timeouts are several times the slowest passing
    # case (12 s for state tests, 58 s for test_block_hashes_history_at_transition).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: state tests
            suite: state
            release: stable
            fixtures: fixtures
            known_failures: known_failures_state.txt
            timeout: 180000
          - name: blockchain tests
            suite: blockchain
            release: stable
            fixtures: fixtures
            known_failures: known_failures_blockchain.txt
            timeout: 300000
          - name: Osaka state tests
            suite: state
            release: develop
            fixtures: fixtures_develop
            known_failures: known_failures_osaka_state.txt
            timeout: 180000
            fork: --fork osaka
          - name: Osaka blockchain tests
            suite: blockchain
            release: develop
            fixtures: fixtures_develop
            known_failures: known_failures_osaka_blockchain.txt
            timeout: 300000
            fork: --fork osaka

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-build-
    # Release tarballs (257 MB stable, 423 MB develop) are cached by asset and
    # pinned version, so only a version bump in fetch.sh downloads them again.
    - name: Read pinned EEST version
      id: eest
      run: echo "version=$(sed -n 's/^EEST_VERSION="\(.*\)"$/\1/p' test/fixtures/eest/fetch.sh)" >> "$GITHUB_OUTPUT"
    - name: Restore EEST release cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/eevm/eest
        key: eest-fixtures-${{ matrix.release }}-${{ steps.eest.outputs.version }}
    - name: Fetch EEST fixtures
      run: test/fixtures/eest/fetch.sh ${{ matrix.release }}
    - name: Install dependencies
      run: mix deps.get
    - name: EEST ${{ matrix.name }}
      run: >-
        mix eevm.${{ matrix.suite }}_tests
        'test/fixtures/eest/${{ matrix.fixtures }}/${{ matrix.suite }}_tests/**/*.json'
        ${{ matrix.fork }}
        --known-failures test/fixtures/eest/${{ matrix.known_failures }}
        --timeout ${{ matrix.timeout }}
        --report eest_${{ matrix.release }}_${{ matrix.suite }}_tests.json
    - name: Upload report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: eest-${{ matrix.release }}-${{ matrix.suite }}-tests-report
        path: eest_${{ matrix.release }}_${{ matrix.suite }}_tests.json

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    - name: Compile project
      run: mix compile
    - name: Generate docs (fail on ExDoc warnings)
      run: |
        mix docs 2>&1 | tee docs.log
        # Only fail on warnings emitted by ExDoc itself (after "Generating docs..."),
        # not on compile warnings from deps that may surface during a fresh build.
        if awk '/Generating docs\.\.\./{flag=1; next} flag' docs.log \
             | grep -E "^[[:space:]]+warning:"; then
          echo "::error::ExDoc emitted warnings — see log above"
          exit 1
        fi
    # Also part of `mix test`; run here so a docs regression fails the Docs job.
    - name: Run the README and guide snippets and lint the public docs
      run: mix test --only docs --warnings-as-errors
