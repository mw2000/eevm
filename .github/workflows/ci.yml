# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          _build
          priv/native
          native/eevm_bls/target
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock', 'native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/src/**') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors
    - name: Run Credo
      run: mix credo --strict
    - name: Run Dialyzer
      run: mix dialyzer

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Documented minimum; shares the build cache with lint and docs.
          - elixir: '1.18.3'
            otp: '27.0'
            cache-prefix: ''
          - elixir: '1.19'
            otp: '28'
            cache-prefix: 'otp28-elixir1.19-'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    # Build output depends on the Elixir/OTP version. The prefix goes before
    # "build-" so the shared "build-" restore key never matches another version.
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          _build
          priv/native
          native/eevm_bls/target
        key: ${{ runner.os }}-${{ matrix.cache-prefix }}build-${{ hashFiles('**/mix.lock', 'native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/src/**') }}
        restore-keys: ${{ runner.os }}-${{ matrix.cache-prefix }}build-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.18.3'
        otp-version: '27.0'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          _build
          priv/native
          native/eevm_bls/target
        key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock', 'native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/src/**') }}
        restore-keys: ${{ runner.os }}-build-
    - name: Install dependencies
      run: mix deps.get
    - name: Compile project
      run: mix compile
    - name: Generate docs (fail on ExDoc warnings)
      run: |
        mix docs 2>&1 | tee docs.log
        # Only fail on warnings emitted by ExDoc itself (after "Generating docs..."),
        # not on compile warnings from deps that may surface during a fresh build.
        if awk '/Generating docs\.\.\./{flag=1; next} flag' docs.log \
             | grep -E "^[[:space:]]+warning:"; then
          echo "::error::ExDoc emitted warnings — see log above"
          exit 1
        fi
